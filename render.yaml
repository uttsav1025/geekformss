# Render Blueprint: one web service (API, plus the built app on the same origin).
# The Vercel frontend proxies /api here (see vercel.json).
# Postgres: point DATABASE_URL at Neon / Render Postgres / any hosted Postgres.
# On Neon set DATABASE_URL to the pooled URL and DATABASE_URL_UNPOOLED to the direct one.
services:
  - type: web
    name: geekforms
    runtime: docker
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: '*'
      # Two hops in front of Express: Vercel's proxy, then Render's. Use '1' without Vercel.
      - key: TRUST_PROXY
        value: '2'
